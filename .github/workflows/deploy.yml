name: Deploy static site

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm required files and assets exist
        run: |
          test -f website/index.html
          test -f website/styles.css
          test -f website/script.js
          test -f website/assets/bmw-x6-hero.png
      - name: Parse JavaScript
        run: node --check script.js
      - name: Validate HTML
        run: npx --yes html-validate index.html

  package:
    name: Package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dist/
        run: |
          mkdir -p dist/assets
          cp index.html styles.css script.js dist/
          cp -R assets/. dist/assets/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  deploy:
    name: Deploy (production)
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ vars.SITE_URL }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}
      - name: Confirm assumed identity
        run: aws sts get-caller-identity
      - name: Upload static assets
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" --delete --exclude "*.html" --cache-control "public,max-age=86400"
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" --content-type "text/html; charset=utf-8" --cache-control "no-cache,no-store,must-revalidate"
      - name: Invalidate CloudFront distribution
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$INVALIDATION_ID"

  verify:
    name: Verify (production)
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm home page and hero asset are reachable
        run: |
          curl --fail --silent --show-error "${{ vars.SITE_URL }}" | grep -q "<title>BMW X6 M60i</title>"
          curl --fail --silent --show-error --head "${{ vars.SITE_URL }}/assets/bmw-x6-hero.png"
